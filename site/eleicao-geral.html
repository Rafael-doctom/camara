<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eleição 2026 · Olho na Câmara</title>
<base target="_blank">
<meta name="description" content="Como cada cidade votou em 2026 para presidente, governador, senador, deputado federal e deputado estadual. Dados oficiais do TSE.">
<meta property="og:title" content="Eleição 2026 · Olho na Câmara">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,500..700,0..100;1,9..144,500,40&family=JetBrains+Mono:wght@500;600&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="tema.css">
<link rel="stylesheet" href="controles.css">
<link rel="stylesheet" href="rodape.css">
<link rel="stylesheet" href="espectro.css">
<style>
  .g-filtros { display: flex; flex-wrap: wrap; gap: 12px 18px; align-items: end; margin: 12px 0 18px; }
  .g-filtros label { display: grid; gap: 4px; font-size: .82rem; color: var(--texto-2); }
  .g-filtros input, .g-filtros select { min-height: 42px; }
  .chip[aria-pressed="true"], .chip[aria-current] { background: var(--texto); color: var(--fundo); border-color: var(--texto); }
  .eg-tabela { width: 100%; border-collapse: collapse; font-size: .88rem; }
  .eg-tabela th, .eg-tabela td { padding: 7px 6px; border-bottom: 1px solid var(--linha); text-align: left; vertical-align: middle; }
  .eg-tabela .n { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .eg-barra { display: block; height: 8px; border-radius: 4px; background: var(--fundo-2); min-width: 60px; }
  .eg-barra i { display: block; height: 100%; border-radius: 4px; background: var(--acento); }
  .eg-num { font-family: var(--f-mono); color: var(--suave); font-size: .8rem; }
</style>
<script>try{var t=localStorage.getItem("olho-tatui-tema");if(t==="escuro"||(!t&&matchMedia("(prefers-color-scheme: dark)").matches))document.documentElement.setAttribute("data-tema","escuro")}catch(e){}</script>
</head>
<body>
<a class="pular" href="#app" target="_self">Pular para o conteúdo</a>
<header class="topo">
  <div class="topo-in">
    <a class="marca" href="index.html" target="_self"><span class="marca-olho">●</span> Olho na Câmara <small>Eleição 2026</small></a>
    <nav class="esp-nav" aria-label="Eleição 2026">
      <a class="botao botao-pr" href="eleicao.html" target="_self">Eleição 2024</a>
      <a class="esp-voltar" href="index.html" target="_self">Cidades</a>
    </nav>
  </div>
</header>

<main class="conteudo" id="app" tabindex="-1"><p class="carregando">Carregando…</p></main>

<footer class="rodape ft2" id="rodape">
  <div class="ft-bot"><span>© 2026 Olho na Câmara · criado por <a href="https://rafaelpintodasilva.com/" rel="noopener">Rafael Pinto da Silva</a></span><span>Fonte: TSE, Portal de Dados Abertos. Sem vínculo com partidos.</span></div>
</footer>

<script>
/* Eleição geral por cidade: #<cidade>/<cargo>/<turno>. Dados em <cidade>/eleicao2026.js
   (agentes/coletor_tse_geral.py). */
(function () {
  "use strict";
  const ANO = 2026;
  const CIDADES = [["tatui", "Tatuí"], ["itapetininga", "Itapetininga"], ["cerquilho", "Cerquilho"], ["ipero", "Iperó"], ["cesario-lange", "Cesário Lange"]];
  const CARGO = { presidente: "Presidente", governador: "Governador", senador: "Senador", deputado_federal: "Deputado federal", deputado_estadual: "Deputado estadual" };
  const app = document.getElementById("app"), cache = {};
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const fmt = (n) => (n || 0).toLocaleString("pt-BR");
  const pct = (n) => `${(n || 0).toLocaleString("pt-BR", { maximumFractionDigits: 1 })}%`;
  const titulo = (s) => String(s || "").toLowerCase().replace(/(^|\s)\S/g, (c) => c.toUpperCase()).replace(/ (D[aeo]s?|E) /g, (m) => m.toLowerCase());
  let filtro = { q: "", partido: "", eleitos: false };

  function carregar(slug, feito) {
    if (cache[slug]) return feito(cache[slug]);
    window.ELEICAO_GERAL = null;
    const s = document.createElement("script");
    s.src = `${slug}/eleicao${ANO}.js`;
    s.onload = () => { cache[slug] = window.ELEICAO_GERAL; feito(cache[slug]); };
    s.onerror = () => { app.innerHTML = `<h1>Sem dados</h1><p>Rode agentes/coletor_tse_geral.py.</p>`; };
    document.head.appendChild(s);
  }

  function pagina(slug, E, cargo, turno) {
    const cargos = [...new Set(E.disputas.map((d) => d.cargo))];
    if (!cargos.includes(cargo)) cargo = cargos[0];
    const turnos = E.disputas.filter((d) => d.cargo === cargo).map((d) => d.turno);
    if (!turnos.includes(turno)) turno = Math.max(...turnos);
    const D = E.disputas.find((d) => d.cargo === cargo && d.turno === turno), C = D.comparecimento || {};
    const partidos = [...new Set(D.candidatos.map((c) => c.partido))].sort();
    const muitos = D.candidatos.length > 15, base = `#${slug}`;
    app.innerHTML = `<p class="esp-rot">Eleição ${ANO} · como a cidade votou</p><h1>${esc(E.cidade)}</h1>
      <div class="chips" role="group" aria-label="Cidade">${CIDADES.map(([s, n]) => `<a class="chip" href="#${s}/${cargo}/${turno}" target="_self"${s === slug ? ' aria-current="page"' : ""}>${n}</a>`).join("")}</div>
      <div class="g-filtros">
        <div class="chips" role="group" aria-label="Cargo">${cargos.map((c) => `<a class="chip" href="${base}/${c}" target="_self"${c === cargo ? ' aria-current="page"' : ""}>${CARGO[c]}</a>`).join("")}</div>
        ${turnos.length > 1 ? `<div class="chips" role="group" aria-label="Turno">${turnos.map((t) => `<a class="chip" href="${base}/${cargo}/${t}" target="_self"${t === turno ? ' aria-current="page"' : ""}>${t}º turno</a>`).join("")}</div>` : ""}
      </div>
      <div class="grade grade-kpi">
        <div class="cartao kpi"><div class="valor">${fmt(C.aptos)}</div><div class="rotulo">eleitores aptos</div></div>
        <div class="cartao kpi"><div class="valor">${C.aptos ? pct(100 * C.comparecimento / C.aptos) : "–"}</div><div class="rotulo">compareceram</div></div>
        <div class="cartao kpi"><div class="valor">${fmt(D.validos)}</div><div class="rotulo">votos válidos${cargo === "senador" ? " (cada eleitor votou em 2)" : ""}</div></div>
        <div class="cartao kpi"><div class="valor">${fmt((C.brancos || 0) + (C.nulos || 0))}</div><div class="rotulo">brancos e nulos</div></div>
      </div>
      <h2>${CARGO[cargo]}${turnos.length > 1 ? ` · ${turno}º turno` : ""}</h2>
      ${muitos ? `<div class="g-filtros">
        <label>Buscar<input type="search" id="f-q" placeholder="Nome ou número" value="${esc(filtro.q)}"></label>
        <label>Partido<select id="f-p"><option value="">Todos</option>${partidos.map((p) => `<option${p === filtro.partido ? " selected" : ""}>${esc(p)}</option>`).join("")}</select></label>
        <label><span>Resultado</span><select id="f-e"><option value="">Todos</option><option value="1"${filtro.eleitos ? " selected" : ""}>Só eleitos</option></select></label></div>` : ""}
      <div class="tabela-wrap"><table class="eg-tabela"><thead><tr><th>Candidato</th><th>Partido</th><th class="n">Votos na cidade</th><th class="n">%</th><th></th><th class="n">Votos ${D.abrangencia === "Brasil" ? "no país" : "no estado"}</th><th>Resultado</th></tr></thead><tbody id="lista"></tbody></table></div>
      <p><button type="button" id="mais" hidden></button></p>
      <p class="suave">Votos válidos (sem brancos e nulos). Fonte: TSE, gerado em ${esc(E.gerado_em.slice(0, 10).split("-").reverse().join("/"))}.</p>`;
    let limite = 50;
    const max = D.candidatos.length ? D.candidatos[0].pct : 1;
    const desenhar = () => {
      const q = filtro.q.toLowerCase();
      const cs = D.candidatos.filter((c) => !muitos || ((!q || c.urna.toLowerCase().includes(q) || c.numero.includes(q))
        && (!filtro.partido || c.partido === filtro.partido) && (!filtro.eleitos || c.situacao.startsWith("Eleito"))));
      app.querySelector("#lista").innerHTML = cs.slice(0, limite).map((c) => `<tr><td><b>${esc(titulo(c.urna))}</b> <span class="eg-num">${esc(c.numero)}</span></td>
        <td>${esc(c.partido)}</td><td class="n">${fmt(c.votos)}</td><td class="n">${pct(c.pct)}</td>
        <td><span class="eg-barra"><i style="width:${(100 * c.pct) / max}%"></i></span></td><td class="n">${fmt(c.total)}</td>
        <td><span class="etq ${c.situacao.startsWith("Eleito") ? "etq-ok" : ""}">${esc(c.situacao || "–")}</span></td></tr>`).join("")
        || `<tr><td colspan="7" class="suave">Ninguém com esse filtro.</td></tr>`;
      const b = app.querySelector("#mais");
      b.hidden = cs.length <= limite;
      b.textContent = `Mostrar mais (${cs.length - limite} restantes)`;
    };
    app.querySelector("#mais").addEventListener("click", () => { limite += 100; desenhar(); });
    if (muitos) {
      app.querySelector("#f-q").addEventListener("input", (e) => { filtro.q = e.target.value; desenhar(); });
      app.querySelector("#f-p").addEventListener("change", (e) => { filtro.partido = e.target.value; desenhar(); });
      app.querySelector("#f-e").addEventListener("change", (e) => { filtro.eleitos = !!e.target.value; desenhar(); });
    }
    desenhar();
    document.title = `${E.cidade}: ${CARGO[cargo]} ${ANO} · Olho na Câmara`;
  }

  function rota() {
    const [slug, cargo, turno] = decodeURIComponent(location.hash.slice(1) || "tatui").split("/");
    const s = CIDADES.some(([c]) => c === slug) ? slug : "tatui";
    carregar(s, (E) => pagina(s, E, cargo || "presidente", +turno || 0));
  }
  window.addEventListener("hashchange", rota);
  rota();
})();
</script>
<script src="topo.js"></script>
</body>
</html>
